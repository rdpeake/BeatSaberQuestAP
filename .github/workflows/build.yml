name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:

env:
  module_id: beatsaberquestap
  qmod_name: BeatSaberQuestAP

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Build and run core tests
        run: |
          cmake -G Ninja -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

  quest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install qpm
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: false
          cache: false

      # beatsaber-hook 6.4 does not build with the libc++ in NDK 30+
      - name: Select NDK 27
        run: |
          ndk_path="$(ls -d "$ANDROID_HOME"/ndk/27.* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$ndk_path" ]; then
            qpm ndk download 27
            ndk_path="$(qpm ndk path 27)"
          fi
          echo "Using NDK at $ndk_path"
          echo "$ndk_path" > "${GITHUB_WORKSPACE}/ndkpath.txt"

      # failures are echoed as annotations, which stay readable where raw logs are not
      - name: Restore qpm dependencies
        run: ./scripts/annotate-failure.sh "qpm restore" qpm restore

      - name: Build and package qmod
        run: ./scripts/annotate-failure.sh "qmod build" qpm s qmod

      - name: Upload qmod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.qmod_name }}.qmod
          path: ./${{ env.qmod_name }}.qmod
          if-no-files-found: error

      - name: Upload unstripped library for crash logs
        uses: actions/upload-artifact@v4
        with:
          name: debug_lib${{ env.module_id }}.so
          path: ./build/debug/lib${{ env.module_id }}.so
          if-no-files-found: error
